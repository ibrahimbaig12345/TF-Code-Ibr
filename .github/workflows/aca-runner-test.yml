name: ACA Self Hosted Runner Test

on:
  workflow_dispatch:

jobs:
  aca-runner-test:
    name: Test ACA Runner

    runs-on:
      - self-hosted
      - aca-poc-linux

    steps:
      - name: Basic runner test
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "ACA SELF-HOSTED RUNNER TEST"
          echo "======================================"

          echo ""
          echo "Current user:"
          whoami || true

          echo ""
          echo "Operating system:"
          cat /etc/os-release

          echo ""
          echo "Git version:"
          git --version

          echo ""
          echo "Azure CLI version:"
          az version

          echo ""
          echo "Working directory:"
          pwd

          echo ""
          echo "Runner environment:"
          echo "RUNNER_NAME=${RUNNER_NAME}"
          echo "RUNNER_OS=${RUNNER_OS}"
          echo "RUNNER_ARCH=${RUNNER_ARCH}"

          echo ""
          echo "======================================"
          echo "ACA RUNNER TEST SUCCESSFUL"
          echo "======================================"
