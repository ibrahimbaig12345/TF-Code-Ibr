name: ACA Runner Toolchain Test

on:
  workflow_dispatch:

jobs:
  toolchain-test:
    runs-on:
      - self-hosted
      - aca-poc-linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate base tools
        shell: bash
        run: |
          set -e

          echo "=== GIT ==="
          git --version

          echo "=== AZURE CLI ==="
          az version

          echo "=== TERRAFORM ==="
          terraform version

          echo "=== POWERSHELL ==="
          pwsh --version

          echo "=== RUNNER ==="
          echo "Name: $RUNNER_NAME"
          echo "OS: $RUNNER_OS"
          echo "Architecture: $RUNNER_ARCH"

          echo "======================================"
          echo "ACA RUNNER TOOLCHAIN TEST SUCCESSFUL"
          echo "======================================"

      - name: Test PowerShell execution
        shell: pwsh
        run: |
          Write-Host "PowerShell execution successful"
          Write-Host "PowerShell version: $($PSVersionTable.PSVersion)"