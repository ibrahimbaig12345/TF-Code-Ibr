name: ACA Azure OIDC Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  oidc-test:
    name: Test Azure OIDC

    runs-on:
      - self-hosted
      - aca-poc-linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display runner information
        shell: bash
        run: |
          echo "======================================"
          echo "ACA RUNNER"
          echo "======================================"

          echo "Runner Name: $RUNNER_NAME"
          echo "Runner OS: $RUNNER_OS"
          echo "Runner Architecture: $RUNNER_ARCH"

      - name: Azure Login using GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate Azure OIDC authentication
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "AZURE OIDC AUTHENTICATION"
          echo "======================================"

          az account show \
            --query "{Subscription:name,SubscriptionId:id,Tenant:tenantId}" \
            --output table

          CURRENT_SUBSCRIPTION=$(az account show --query id --output tsv)

          if [ "$CURRENT_SUBSCRIPTION" != "35599a72-2311-44a7-b4f9-cd67ce8a7f93" ]; then
            echo "ERROR: Unexpected Azure subscription"
            exit 1
          fi

          echo ""
          echo "AZURE OIDC AUTHENTICATION SUCCESSFUL"

      - name: Validate Terraform
        shell: bash
        run: |
          echo "======================================"
          echo "TERRAFORM"
          echo "======================================"

          terraform version

      - name: Validate PowerShell
        shell: pwsh
        run: |
          Write-Host "======================================"
          Write-Host "POWERSHELL"
          Write-Host "======================================"

          Write-Host "PowerShell version: $($PSVersionTable.PSVersion)"
          Write-Host "PowerShell test successful"