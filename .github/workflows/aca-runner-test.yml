name: ACA Terraform OIDC Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on:
      - self-hosted
      - aca-poc-linux

    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      TF_VAR_client_id: ${{ secrets.AZURE_CLIENT_ID }}
      TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Generate unique storage account name
        shell: bash
        run: |
          STORAGE_NAME="stacapoc${GITHUB_RUN_NUMBER}${GITHUB_RUN_ATTEMPT}"

          echo "Storage account: $STORAGE_NAME"

          echo "TF_VAR_storage_account_name=$STORAGE_NAME" >> "$GITHUB_ENV"

      - name: Terraform Init
        shell: bash
        working-directory: terraform-poc
        run: |
          terraform init

      - name: Terraform Validate
        shell: bash
        working-directory: terraform-poc
        run: |
          terraform validate

      - name: Terraform Plan
        shell: bash
        working-directory: terraform-poc
        run: |
          terraform plan \
            -out=tfplan

      - name: Terraform Apply
        shell: bash
        working-directory: terraform-poc
        run: |
          terraform apply \
            -auto-approve \
            tfplan

      - name: Verify Azure resource
        shell: bash
        run: |
          echo "======================================"
          echo "TERRAFORM DEPLOYMENT SUCCESSFUL"
          echo "======================================"

          az storage account show \
            --name "$TF_VAR_storage_account_name" \
            --resource-group "rg-github-runner-poc" \
            --query "{Name:name,Location:location,ProvisioningState:provisioningState}" \
            --output table