
name: Inspect GitHub OIDC Claims

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, azure-vmss-lab]

    steps:
      - name: Display OIDC claims safely
        run: |
          python3 - <<'PY'
          import os
          import json
          import urllib.request
          import base64

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          url += "&audience=api%3A%2F%2FAzureADTokenExchange"

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization":
                  "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
              }
          )

          response = json.load(urllib.request.urlopen(request))
          token = response["value"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(
              base64.urlsafe_b64decode(payload)
          )

          print("Issuer:", claims.get("iss"))
          print("Subject:", claims.get("sub"))
          print("Audience:", claims.get("aud"))
          PY
