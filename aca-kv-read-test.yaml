identity:
  type: UserAssigned
  userAssignedIdentities:
    /subscriptions/35599a72-2311-44a7-b4f9-cd67ce8a7f93/resourceGroups/rg-github-runner-poc/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-github-runner-poc: {}

location: centralindia

name: caj-runner-test

properties:
  configuration:
    manualTriggerConfig:
      parallelism: 1
      replicaCompletionCount: 1
    replicaRetryLimit: 0
    replicaTimeout: 600
    triggerType: Manual

  environmentId: /subscriptions/35599a72-2311-44a7-b4f9-cd67ce8a7f93/resourceGroups/rg-github-runner-poc/providers/Microsoft.App/managedEnvironments/cae-github-runner-poc

  template:
    containers:
      - name: caj-runner-test

        image: mcr.microsoft.com/deployment-environments/runners/core:latest

        imageType: ContainerImage

        command:
          - /bin/bash

        args:
          - -c
          - |
            set -e

            echo "======================================"
            echo "KEY VAULT READ TEST"
            echo "======================================"

            echo "=== MANAGED IDENTITY LOGIN ==="

            az login \
              --identity \
              --client-id "f090a570-9338-4393-b0bd-0f48e7fb7723" \
              --output none

            echo "Managed Identity login successful"

            echo "=== KEY VAULT DNS ==="

            getent hosts kv-ghrunner-ibr-poc.vault.azure.net

            echo "=== READING GITHUB APP ID ==="

            GH_APP_ID=$(az keyvault secret show \
              --vault-name "kv-ghrunner-ibr-poc" \
              --name "github-app-id" \
              --query value \
              --output tsv)

            echo "github-app-id read successfully"

            echo "=== READING INSTALLATION ID ==="

            GH_INSTALLATION_ID=$(az keyvault secret show \
              --vault-name "kv-ghrunner-ibr-poc" \
              --name "github-installation-id" \
              --query value \
              --output tsv)

            echo "github-installation-id read successfully"

            echo "=== READING PRIVATE KEY ==="

            GH_PRIVATE_KEY_B64=$(az keyvault secret show \
              --vault-name "kv-ghrunner-ibr-poc" \
              --name "github-app-private-key-b64" \
              --query value \
              --output tsv)

            echo "github-app-private-key-b64 read successfully"

            echo "=== VALIDATING VALUES ==="

            if [ -z "$GH_APP_ID" ]; then
              echo "ERROR: GitHub App ID is empty"
              exit 1
            fi

            if [ -z "$GH_INSTALLATION_ID" ]; then
              echo "ERROR: GitHub Installation ID is empty"
              exit 1
            fi

            if [ -z "$GH_PRIVATE_KEY_B64" ]; then
              echo "ERROR: GitHub private key is empty"
              exit 1
            fi

            echo "All GitHub App secrets retrieved successfully"

            echo "======================================"
            echo "KEY VAULT READ TEST SUCCESSFUL"
            echo "======================================"

            sleep 300

        resources:
          cpu: 0.5
          memory: 1Gi

  workloadProfileName: Consumption

resourceGroup: rg-github-runner-poc

type: Microsoft.App/jobs