identity:
  type: UserAssigned
  userAssignedIdentities:
    /subscriptions/35599a72-2311-44a7-b4f9-cd67ce8a7f93/resourceGroups/rg-github-runner-poc/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-github-runner-poc: {}
location: centralindia
name: caj-runner-test
properties:
  configuration:
    manualTriggerConfig:
      parallelism: 1
      replicaCompletionCount: 1
    replicaRetryLimit: 0
    replicaTimeout: 600
    triggerType: Manual
  environmentId: /subscriptions/35599a72-2311-44a7-b4f9-cd67ce8a7f93/resourceGroups/rg-github-runner-poc/providers/Microsoft.App/managedEnvironments/cae-github-runner-poc
  template:
    containers:
      - name: caj-runner-test
        image: mcr.microsoft.com/deployment-environments/runners/core:latest
        imageType: ContainerImage
        command:
          - /bin/bash
        args:
          - -c
          - |
            echo "======================================"
            echo "ACA GitHub Runner Test"
            echo "======================================"

            echo "=== OS ==="
            cat /etc/os-release || true

            echo "=== TOOLS ==="
            command -v curl || true
            command -v git || true
            command -v az || true
            command -v pwsh || true
            command -v terraform || true

            echo "=== TOOL VERSIONS ==="
            curl --version | head -n 1 || true
            git --version || true
            az version || true
            pwsh --version || true
            terraform version || true

            echo "=== DNS CONFIGURATION ==="
            cat /etc/resolv.conf || true

            echo "=== KEY VAULT DNS ==="
            getent hosts kv-ghrunner-ibr-poc.vault.azure.net || true

            echo "=== KEY VAULT HTTPS ==="
            curl -I --connect-timeout 10 https://kv-ghrunner-ibr-poc.vault.azure.net/ || true

            echo "=== TEST COMPLETE ==="
        resources:
          cpu: 0.5
          memory: 1Gi
  workloadProfileName: Consumption
resourceGroup: rg-github-runner-poc
type: Microsoft.App/jobs
