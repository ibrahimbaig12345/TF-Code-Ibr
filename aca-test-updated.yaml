identity:
  type: UserAssigned
  userAssignedIdentities:
    /subscriptions/35599a72-2311-44a7-b4f9-cd67ce8a7f93/resourceGroups/rg-github-runner-poc/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-github-runner-poc: {}

location: centralindia

name: caj-runner-test

properties:
  configuration:
    manualTriggerConfig:
      parallelism: 1
      replicaCompletionCount: 1
    replicaRetryLimit: 0
    replicaTimeout: 600
    triggerType: Manual

  environmentId: /subscriptions/35599a72-2311-44a7-b4f9-cd67ce8a7f93/resourceGroups/rg-github-runner-poc/providers/Microsoft.App/managedEnvironments/cae-github-runner-poc

  template:
    containers:
      - name: caj-runner-test
        image: mcr.microsoft.com/deployment-environments/runners/core:latest
        imageType: ContainerImage

        command:
          - /bin/bash

        args:
          - -c
          - |
            echo "======================================"
            echo "ACA MANAGED IDENTITY TEST"
            echo "======================================"

            echo "=== AZURE CLI VERSION ==="
            az version

            echo "=== MANAGED IDENTITY LOGIN ==="
            az login \
              --identity \
              --client-id "f090a570-9338-4393-b0bd-0f48e7fb7723"

            LOGIN_EXIT_CODE=$?

            echo "=== LOGIN EXIT CODE ==="
            echo "$LOGIN_EXIT_CODE"

            if [ "$LOGIN_EXIT_CODE" -ne 0 ]; then
              echo "ERROR: Managed Identity login failed"
              exit 1
            fi

            echo "=== CURRENT AZURE CONTEXT ==="
            az account show \
              --query "{Subscription:name,SubscriptionId:id,Tenant:tenantId}" \
              --output table

            echo "=== KEY VAULT DNS ==="
            getent hosts kv-ghrunner-ibr-poc.vault.azure.net || true

            echo "=== KEY VAULT HTTPS ==="
            curl -I \
              --connect-timeout 10 \
              https://kv-ghrunner-ibr-poc.vault.azure.net/ || true

            echo "======================================"
            echo "MANAGED IDENTITY TEST COMPLETE"
            echo "======================================"

            echo "Keeping container alive for log collection..."
            sleep 300

        resources:
          cpu: 0.5
          memory: 1Gi

  workloadProfileName: Consumption

resourceGroup: rg-github-runner-poc

type: Microsoft.App/jobs